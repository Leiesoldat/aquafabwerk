# CoolerControl service-plugin manifest for aquapx.
# Installed to /var/lib/coolercontrol/plugins/aquapx/manifest.toml; coolercontrold launches
# the executable and connects over the Unix Domain Socket below to drive the D5 Next RGB.
# The pump's SENSORS come from the kernel aquacomputer_d5next driver separately; this plugin
# adds only the lighting CoolerControl can't otherwise control.
id = "aquapx"
type = "device"
description = "Aquacomputer RGB lighting (aquapx)"
version = "0.1.0"
url = "https://github.com/leiesoldat/aquafabwerk"
address = "/run/aquapx.sock"
# Path to the service executable. (optional)
# If you specify only the filename, the executable is expected to be in the same plugin
# directory as this manifest.toml.
# If it is located elsewhere, use an absolute path. Ensure it has execute permissions (chmod +x).
# If this is commented out, then CoolerControl will not manage the service and assume it is managed by other means (systemd, etc).
executable = "aquapx-plugin"
privileged = true
